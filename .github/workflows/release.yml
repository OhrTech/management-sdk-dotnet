name: Release

# Push a tag such as v1.0.1 to publish that version to nuget.org. Publishing uses nuget.org trusted
# publishing (no stored API key): the OhrTech organisation on nuget.org has a policy trusting this
# repo's release.yml in the "release" environment. NUGET_USER is the nuget.org user name (not the
# email) of a member of that organisation.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # the GitHub release
      id-token: write   # the OIDC token nuget.org trades for a short-lived API key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet build -c Release -p:Version=$VERSION
      - name: Works with reflection-based JSON off
        run: dotnet run --no-cache tests/no-reflection.cs
      - run: dotnet pack -c Release --no-build -p:Version=$VERSION -o artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --title "$GITHUB_REF_NAME" --generate-notes $([[ "$VERSION" == *-* ]] && echo --prerelease)
